AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: wisaw - ゲストに向けた出欠回答/コンテンツ配信のためのWebサービス

Parameters:
    SesFromAddress:
        Type: String
        Default: noreply@wisaw.click
        Description: SES verified sender email address
    AllowOrigin:
        Type: String
        Default: "*"
        Description: CORS allowed origin for the API

Globals:
    Function:
        Runtime: nodejs20.x
        Timeout: 10
        MemorySize: 256
        Environment:
            Variables:
                TABLE_NAME: wisaw-submissions
                AWS_REGION: ap-northeast-1
                USE_SES: "1"
                SES_FROM_ADDRESS: !Ref SesFromAddress

Resources:
    Api:
        Type: AWS::Serverless::HttpApi
        Properties:
            CorsConfiguration:
                AllowOrigins:
                    - !Ref AllowOrigin
                AllowHeaders:
                    - content-type
                AllowMethods:
                    - POST
                    - OPTIONS

    SubmitFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/api/
            Handler: dist/handler.handler
            Policies:
                - DynamoDBCrudPolicy:
                      TableName: !Ref SubmissionsTable
                - Statement:
                      - Effect: Allow
                        Action:
                            - ses:SendEmail
                            - ses:SendRawEmail
                        Resource: "*"
            Events:
                Submit:
                    Type: HttpApi
                    Properties:
                        ApiId: !Ref Api
                        Path: /submit
                        Method: POST

    SubmissionsTable:
        Type: AWS::Serverless::SimpleTable
        Properties:
            TableName: wisaw-submissions
            PrimaryKey:
                Name: pk
                Type: String
