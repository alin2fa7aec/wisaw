AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: wisaw local dev

Globals:
    Function:
        Runtime: nodejs20.x
        Timeout: 10
        MemorySize: 256
        Environment:
            Variables:
                TABLE_NAME: wisaw-submissions
                # ローカルでは DynamoDB Local を叩くため endpoint を渡す
                DYNAMODB_ENDPOINT: http://dynamodb-local:8000
                AWS_REGION: ap-northeast-1
                AWS_ACCESS_KEY_ID: dummy
                AWS_SECRET_ACCESS_KEY: dummy

Resources:
    Api:
        Type: AWS::Serverless::HttpApi
        Properties:
            CorsConfiguration:
                AllowOrigins:
                    - http://localhost:5173
                AllowHeaders:
                    - content-type
                AllowMethods:
                    - POST
                    - OPTIONS

    SubmitFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/api/
            Handler: dist/handler.handler
            Policies:
                - DynamoDBCrudPolicy:
                      TableName: !Ref SubmissionsTable
            Events:
                Submit:
                    Type: HttpApi
                    Properties:
                        ApiId: !Ref Api
                        Path: /submit
                        Method: POST

    SubmissionsTable:
        Type: AWS::Serverless::SimpleTable
        Properties:
            TableName: wisaw-submissions
            PrimaryKey:
                Name: pk
                Type: String
