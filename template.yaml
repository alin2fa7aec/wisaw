AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: wisaw - ゲストに向けた出欠回答/コンテンツ配信のためのWebサービス

Parameters:
    SesFromAddress:
        Type: String
        Default: noreply@wisaw.click
        Description: SES verified sender email address
    AllowOrigin:
        Type: String
        Default: https://wisaw.click
        Description: CORS allowed origin for the API
    DomainName:
        Type: String
        Default: wisaw.click
        Description: Custom domain name for CloudFront
    AcmCertificateArn:
        Type: String
        Description: ACM certificate ARN (must be in us-east-1)
    HostedZoneId:
        Type: String
        Description: Route 53 hosted zone ID for the domain
    MomentOpenAt:
        Type: String
        Default: "2026-10-18T00:00:00+09:00"
        Description: MomentShare upload window open (ISO8601)
    MomentCloseAt:
        Type: String
        Default: "2026-10-25T23:59:59+09:00"
        Description: MomentShare upload window close (ISO8601)

Globals:
    Function:
        Runtime: nodejs20.x
        Timeout: 10
        MemorySize: 256
        Environment:
            Variables:
                TABLE_NAME: wisaw-submissions
                USE_SES: "1"
                SES_FROM_ADDRESS: !Ref SesFromAddress
                # 本番では空。ローカルでのみ env.json から DynamoDB Local を指す。
                # sam local の --env-vars はテンプレートに宣言済みの変数しか
                # 上書きできないため、ここに宣言が無いと差し替えが効かない。
                DYNAMODB_ENDPOINT: ""

Resources:
    Api:
        Type: AWS::Serverless::HttpApi
        Properties:
            CorsConfiguration:
                AllowOrigins:
                    - !Ref AllowOrigin
                AllowHeaders:
                    - content-type
                AllowMethods:
                    - POST
                    - OPTIONS

    SubmitFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/api/
            Handler: dist/handler.handler
            Policies:
                - DynamoDBCrudPolicy:
                      TableName: !Ref SubmissionsTable
                - Statement:
                      - Effect: Allow
                        Action:
                            - ses:SendEmail
                            - ses:SendRawEmail
                        Resource: "*"
            Events:
                Submit:
                    Type: HttpApi
                    Properties:
                        ApiId: !Ref Api
                        Path: /submit
                        Method: POST

    SubmissionsTable:
        Type: AWS::Serverless::SimpleTable
        Properties:
            TableName: wisaw-submissions
            PrimaryKey:
                Name: pk
                Type: String

    # ------------------------------------------------------------------
    # MomentShare — ゲストによる写真共有
    # ------------------------------------------------------------------

    # 非公開バケット。アップロードの着地点(upload/)と、EXIF を保持したままの
    # オリジナル(original/)を置く。GPS が残っているため CloudFront のオリジンには
    # 決してしないこと。
    MomentSrcBucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: !Sub "${DomainName}-moments-src"
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
            CorsConfiguration:
                CorsRules:
                    - AllowedOrigins:
                          - !Ref AllowOrigin
                      AllowedMethods:
                          - POST
                      AllowedHeaders:
                          - "*"
            LifecycleConfiguration:
                Rules:
                    # 検証を通らず放置された着地点のゴミを片付ける
                    - Id: AbortStaleUploads
                      Status: Enabled
                      Prefix: upload/
                      ExpirationInDays: 1
                    - Id: AbortIncompleteMultipart
                      Status: Enabled
                      AbortIncompleteMultipartUpload:
                          DaysAfterInitiation: 1

    # 公開バケット。閲覧用・サムネイル・manifest.json のみ。
    # 既存の ImageBucket と分けているのは、deploy_images.sh の
    # `aws s3 sync --delete` がゲストの写真を消してしまうため。
    MomentPubBucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: !Sub "${DomainName}-moments"
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
            LifecycleConfiguration:
                Rules:
                    # 派生物はオリジナルから再生成できるので自動削除してよい。
                    # オリジナル側には自動削除を設定しない(退避完了の確認を人が挟む)。
                    - Id: ExpireViews
                      Status: Enabled
                      Prefix: moments/view/
                      ExpirationInDays: 60
                    - Id: ExpireThumbs
                      Status: Enabled
                      Prefix: moments/thumb/
                      ExpirationInDays: 60

    MomentPubBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref MomentPubBucket
            PolicyDocument:
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: cloudfront.amazonaws.com
                      Action: s3:GetObject
                      Resource: !Sub "${MomentPubBucket.Arn}/*"
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

    MomentTable:
        Type: AWS::Serverless::SimpleTable
        Properties:
            TableName: wisaw-moments
            PrimaryKey:
                Name: pk
                Type: String
            SSESpecification:
                SSEEnabled: true

    # sharp はネイティブモジュールのため esbuild でバンドルできない。
    # tools/build_sharp_layer.sh で生成したものを供給する。
    # 実体は tools/build_sharp_layer.sh が nodejs/node_modules/ まで組んで用意する。
    # 同スクリプトが置く Makefile 経由でコピーさせることで、ビルド成果物を見れば
    # 何がデプロイされるか分かる状態にしている。
    SharpLayer:
        Type: AWS::Serverless::LayerVersion
        Properties:
            LayerName: wisaw-sharp
            ContentUri: layers/sharp/
            CompatibleRuntimes:
                - nodejs20.x
        Metadata:
            BuildMethod: makefile

    # Presigned POST の発行。受付期間・レート・容量の各上限をここで見る。
    MomentPresignFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/api/
            Handler: dist/moment-presign.handler
            Environment:
                Variables:
                    MOMENT_TABLE_NAME: !Ref MomentTable
                    MOMENT_SRC_BUCKET: !Ref MomentSrcBucket
                    MOMENT_OPEN_AT: !Ref MomentOpenAt
                    MOMENT_CLOSE_AT: !Ref MomentCloseAt
                    # 本番では空。ローカルでのみ env.json から MinIO を指す。
                    S3_ENDPOINT: ""
            Policies:
                - DynamoDBCrudPolicy:
                      TableName: !Ref MomentTable
                - Statement:
                      - Effect: Allow
                        Action: s3:PutObject
                        Resource: !Sub "${MomentSrcBucket.Arn}/upload/*"
            Events:
                Presign:
                    Type: HttpApi
                    Properties:
                        ApiId: !Ref Api
                        Path: /moment/presign
                        Method: POST

    # ゲストによる自己削除。hidden を立てて manifest から外すソフト削除で、
    # S3 の実体には触らない。式中は運営側が対応できない前提のため、
    # 「間違えて上げた」をゲスト自身で解決できる口として用意している。
    MomentDeleteFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/api/
            Handler: dist/moment-delete.handler
            # manifest の再構築で全件 Scan するため、既定の3秒では足りなくなりうる。
            Timeout: 60
            Environment:
                Variables:
                    MOMENT_TABLE_NAME: !Ref MomentTable
                    MOMENT_PUB_BUCKET: !Ref MomentPubBucket
                    # 本番では空。ローカルでのみ env.json から MinIO を指す。
                    S3_ENDPOINT: ""
            Policies:
                - DynamoDBCrudPolicy:
                      TableName: !Ref MomentTable
                - S3CrudPolicy:
                      BucketName: !Sub "${DomainName}-moments"
            Events:
                Delete:
                    Type: HttpApi
                    Properties:
                        ApiId: !Ref Api
                        Path: /moment/delete
                        Method: POST

    # アップロード完了を受けて検証・リサイズ・manifest 再構築を行う。
    MomentProcessFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/api/
            Handler: dist/moment-process.handler
            # sharp のデコードとリサイズはメモリを食う。24MP の写真で数秒かかる。
            MemorySize: 2048
            Timeout: 60
            Layers:
                - !Ref SharpLayer
            Environment:
                Variables:
                    MOMENT_TABLE_NAME: !Ref MomentTable
                    # このバケットは下の S3 イベントで自身の通知設定にこの関数を持つ。
                    # !Ref で参照すると循環参照になるため、名前を直接組み立てる。
                    MOMENT_SRC_BUCKET: !Sub "${DomainName}-moments-src"
                    MOMENT_PUB_BUCKET: !Sub "${DomainName}-moments"
                    # 本番では空。ローカルでのみ env.json から MinIO を指す。
                    S3_ENDPOINT: ""
            Policies:
                - DynamoDBCrudPolicy:
                      TableName: !Ref MomentTable
                - S3CrudPolicy:
                      BucketName: !Sub "${DomainName}-moments-src"
                - S3CrudPolicy:
                      BucketName: !Sub "${DomainName}-moments"
            Events:
                Uploaded:
                    Type: S3
                    Properties:
                        Bucket: !Ref MomentSrcBucket
                        Events: s3:ObjectCreated:*
                        Filter:
                            S3Key:
                                Rules:
                                    - Name: prefix
                                      Value: upload/

    # manifest.json の再構築のみを行う。イベントソースを持たず CLI から呼ぶ。
    # 写真を隠した後に一覧へ反映させるための口(tools/moment_admin.sh rebuild)。
    MomentRebuildFunction:
        Type: AWS::Serverless::Function
        Properties:
            FunctionName: wisaw-moment-rebuild
            CodeUri: apps/api/
            Handler: dist/moment-manifest.rebuildHandler
            Timeout: 60
            # 再構築のロジックは sharp を読み込まない moment-manifest.ts に
            # 分離してあるため、この関数にレイヤーは要らない。
            Environment:
                Variables:
                    MOMENT_TABLE_NAME: !Ref MomentTable
                    MOMENT_PUB_BUCKET: !Ref MomentPubBucket
            Policies:
                - DynamoDBCrudPolicy:
                      TableName: !Ref MomentTable
                - S3CrudPolicy:
                      BucketName: !Sub "${DomainName}-moments"

    SesBounceSnsTopic:
        Type: AWS::SNS::Topic
        Properties:
            TopicName: wisaw-ses-bounce

    BounceHandlerFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/api/
            Handler: dist/bounce-handler.handler
            Policies:
                - DynamoDBCrudPolicy:
                      TableName: !Ref SubmissionsTable
            Events:
                SnsEvent:
                    Type: SNS
                    Properties:
                        Topic: !Ref SesBounceSnsTopic

    WebBucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: !Sub "${DomainName}-web"
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true

    WebBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref WebBucket
            PolicyDocument:
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: cloudfront.amazonaws.com
                      Action: s3:GetObject
                      Resource: !Sub "${WebBucket.Arn}/*"
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

    ImageBucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: !Sub "${DomainName}-images"
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true

    ImageBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref ImageBucket
            PolicyDocument:
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: cloudfront.amazonaws.com
                      Action: s3:GetObject
                      Resource: !Sub "${ImageBucket.Arn}/*"
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

    CloudFrontOAC:
        Type: AWS::CloudFront::OriginAccessControl
        Properties:
            OriginAccessControlConfig:
                Name: !Sub "${DomainName}-oac"
                OriginAccessControlOriginType: s3
                SigningBehavior: always
                SigningProtocol: sigv4

    CloudFrontDistribution:
        Type: AWS::CloudFront::Distribution
        Properties:
            DistributionConfig:
                Enabled: true
                DefaultRootObject: index.html
                Aliases:
                    - !Ref DomainName
                ViewerCertificate:
                    AcmCertificateArn: !Ref AcmCertificateArn
                    SslSupportMethod: sni-only
                    MinimumProtocolVersion: TLSv1.2_2021
                Origins:
                    - Id: S3Origin
                      DomainName: !GetAtt WebBucket.RegionalDomainName
                      OriginAccessControlId: !Ref CloudFrontOAC
                      S3OriginConfig:
                          OriginAccessIdentity: ""
                    - Id: ImageS3Origin
                      DomainName: !GetAtt ImageBucket.RegionalDomainName
                      OriginAccessControlId: !Ref CloudFrontOAC
                      S3OriginConfig:
                          OriginAccessIdentity: ""
                    - Id: MomentS3Origin
                      DomainName: !GetAtt MomentPubBucket.RegionalDomainName
                      OriginAccessControlId: !Ref CloudFrontOAC
                      S3OriginConfig:
                          OriginAccessIdentity: ""
                CacheBehaviors:
                    - PathPattern: "images/*"
                      TargetOriginId: ImageS3Origin
                      ViewerProtocolPolicy: redirect-to-https
                      CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
                      Compress: true
                    # MomentShare は閲覧用・サムネイル・manifest のみを配信する。
                    # オリジナルは別バケット(MomentSrcBucket)にあり、ここには出てこない。
                    # CachingOptimized はオリジンの Cache-Control を尊重するため、
                    # Lambda が付けた max-age=300 / max-age=5 がそのまま効く。
                    - PathPattern: "moments/*"
                      TargetOriginId: MomentS3Origin
                      ViewerProtocolPolicy: redirect-to-https
                      CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
                      Compress: true
                DefaultCacheBehavior:
                    TargetOriginId: S3Origin
                    ViewerProtocolPolicy: redirect-to-https
                    CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
                    Compress: true
                CustomErrorResponses:
                    - ErrorCode: 403
                      ResponseCode: 200
                      ResponsePagePath: /index.html
                    - ErrorCode: 404
                      ResponseCode: 200
                      ResponsePagePath: /index.html

    DnsRecord:
        Type: AWS::Route53::RecordSet
        Properties:
            HostedZoneId: !Ref HostedZoneId
            Name: !Ref DomainName
            Type: A
            AliasTarget:
                DNSName: !GetAtt CloudFrontDistribution.DomainName
                HostedZoneId: Z2FDTNDATAQYW2

Outputs:
    ApiUrl:
        Description: API Gateway endpoint URL
        Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
    WebUrl:
        Description: CloudFront distribution URL
        Value: !Sub "https://${DomainName}"
    CloudFrontDistributionId:
        Description: CloudFront distribution ID (for cache invalidation)
        Value: !Ref CloudFrontDistribution
    ImageBucketName:
        Description: S3 bucket for image assets
        Value: !Ref ImageBucket
    SesBounceTopicArn:
        Description: SNS topic ARN for SES bounce/complaint notifications
        Value: !Ref SesBounceSnsTopic
