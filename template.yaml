AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: wisaw - ゲストに向けた出欠回答/コンテンツ配信のためのWebサービス

Parameters:
    SesFromAddress:
        Type: String
        Default: noreply@wisaw.click
        Description: SES verified sender email address
    AllowOrigin:
        Type: String
        Default: https://wisaw.click
        Description: CORS allowed origin for the API
    DomainName:
        Type: String
        Default: wisaw.click
        Description: Custom domain name for CloudFront
    AcmCertificateArn:
        Type: String
        Description: ACM certificate ARN (must be in us-east-1)
    HostedZoneId:
        Type: String
        Description: Route 53 hosted zone ID for the domain

Globals:
    Function:
        Runtime: nodejs20.x
        Timeout: 10
        MemorySize: 256
        Environment:
            Variables:
                TABLE_NAME: wisaw-submissions
                AWS_REGION: ap-northeast-1
                USE_SES: "1"
                SES_FROM_ADDRESS: !Ref SesFromAddress

Resources:
    Api:
        Type: AWS::Serverless::HttpApi
        Properties:
            CorsConfiguration:
                AllowOrigins:
                    - !Ref AllowOrigin
                AllowHeaders:
                    - content-type
                AllowMethods:
                    - POST
                    - OPTIONS

    SubmitFunction:
        Type: AWS::Serverless::Function
        Properties:
            CodeUri: apps/api/
            Handler: dist/handler.handler
            Policies:
                - DynamoDBCrudPolicy:
                      TableName: !Ref SubmissionsTable
                - Statement:
                      - Effect: Allow
                        Action:
                            - ses:SendEmail
                            - ses:SendRawEmail
                        Resource: "*"
            Events:
                Submit:
                    Type: HttpApi
                    Properties:
                        ApiId: !Ref Api
                        Path: /submit
                        Method: POST

    SubmissionsTable:
        Type: AWS::Serverless::SimpleTable
        Properties:
            TableName: wisaw-submissions
            PrimaryKey:
                Name: pk
                Type: String

    WebBucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: !Sub "${DomainName}-web"
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true

    WebBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref WebBucket
            PolicyDocument:
                Statement:
                    - Effect: Allow
                      Principal:
                          Service: cloudfront.amazonaws.com
                      Action: s3:GetObject
                      Resource: !Sub "${WebBucket.Arn}/*"
                      Condition:
                          StringEquals:
                              AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

    CloudFrontOAC:
        Type: AWS::CloudFront::OriginAccessControl
        Properties:
            OriginAccessControlConfig:
                Name: !Sub "${DomainName}-oac"
                OriginAccessControlOriginType: s3
                SigningBehavior: always
                SigningProtocol: sigv4

    CloudFrontDistribution:
        Type: AWS::CloudFront::Distribution
        Properties:
            DistributionConfig:
                Enabled: true
                DefaultRootObject: index.html
                Aliases:
                    - !Ref DomainName
                ViewerCertificate:
                    AcmCertificateArn: !Ref AcmCertificateArn
                    SslSupportMethod: sni-only
                    MinimumProtocolVersion: TLSv1.2_2021
                Origins:
                    - Id: S3Origin
                      DomainName: !GetAtt WebBucket.RegionalDomainName
                      OriginAccessControlId: !Ref CloudFrontOAC
                      S3OriginConfig:
                          OriginAccessIdentity: ""
                DefaultCacheBehavior:
                    TargetOriginId: S3Origin
                    ViewerProtocolPolicy: redirect-to-https
                    CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
                    Compress: true
                CustomErrorResponses:
                    - ErrorCode: 403
                      ResponseCode: 200
                      ResponsePagePath: /index.html
                    - ErrorCode: 404
                      ResponseCode: 200
                      ResponsePagePath: /index.html

    DnsRecord:
        Type: AWS::Route53::RecordSet
        Properties:
            HostedZoneId: !Ref HostedZoneId
            Name: !Ref DomainName
            Type: A
            AliasTarget:
                DNSName: !GetAtt CloudFrontDistribution.DomainName
                HostedZoneId: Z2FDTNDATAQYW2

Outputs:
    ApiUrl:
        Description: API Gateway endpoint URL
        Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
    WebUrl:
        Description: CloudFront distribution URL
        Value: !Sub "https://${DomainName}"
    CloudFrontDistributionId:
        Description: CloudFront distribution ID (for cache invalidation)
        Value: !Ref CloudFrontDistribution
