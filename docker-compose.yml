services:
    dynamodb-local:
        image: amazon/dynamodb-local:latest
        container_name: dynamodb-local
        command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
        ports:
            - "8000:8000"

    # MomentShare のローカル確認用の S3 代替。
    # Presigned POST の content-length-range 条件も MinIO は解釈できるため、
    # 上限まわりの挙動を本番と同じ経路で確かめられる。
    minio:
        image: minio/minio:latest
        container_name: minio
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
            # MinIO は PutBucketCors に未対応なので、本番で template.yaml の
            # CorsConfiguration が担う部分をサーバ設定で代替する。
            MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:5173"
        ports:
            - "9000:9000"
            - "9001:9001"
